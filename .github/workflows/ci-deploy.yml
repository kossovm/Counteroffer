name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GHCR requires lowercase names; the repository is "Counteroffer" with a capital C.
  IMAGE: ghcr.io/kossovm/counteroffer

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # normalise pasted keys: strip CR, guarantee a trailing newline
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy >/dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY is not a valid private key. Paste the full output of 'cat ~/.ssh/counter_deploy' (not the .pub), from -----BEGIN to -----END."
            exit 1
          fi
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Upload compose file
        run: |
          ssh -i ~/.ssh/deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p ~/counter'
          scp -i ~/.ssh/deploy -P "$SSH_PORT" docker-compose.yml "$SSH_USER@$SSH_HOST:~/counter/docker-compose.yml"
      - name: Pull and restart (only the counter stack)
        run: |
          ssh -i ~/.ssh/deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' GHCR_USER='${{ github.actor }}' IMAGE_TAG='${{ github.sha }}' bash -s" <<'EOF'
          set -euo pipefail
          cd ~/counter
          test -f .env || { echo "~/counter/.env is missing"; exit 1; }
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export IMAGE_TAG
          docker compose -p counter pull app
          docker compose -p counter up -d --remove-orphans
          docker logout ghcr.io
          # remove only this project's old images, never touch anything else on the host
          docker image prune -af --filter "label=app=counter" --filter "until=2h" || true
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' counter-app 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && { echo "counter-app healthy"; exit 0; }
            sleep 2
          done
          docker logs --tail 80 counter-app
          exit 1
          EOF
