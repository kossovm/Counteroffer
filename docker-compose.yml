# Production stack. Lives on the server in ~/counter next to a .env file (see .env.example).
# Deployed with:  docker compose -p counter pull && docker compose -p counter up -d
#
# Isolation from the other app on the same host:
#  - no published ports at all; Caddy (already running) reaches counter-app over a shared docker network
#  - the database sits on a private network the proxy cannot see
#  - hard memory caps so this stack can never starve the neighbour
#
# IMPORTANT: Compose registers every service name as a DNS alias on every network the service joins.
# The shared proxy network already has a service called `app` (Nice Almaty). Service names here MUST be
# unique on that network, otherwise Caddy load-balances the neighbour's traffic into this app.
name: counter

services:
  counter-app:
    image: ghcr.io/kossovm/counteroffer:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://counter:${POSTGRES_PASSWORD}@counter-db:5432/counter
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      counter-db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    networks:
      internal: {}
      proxy:
        aliases: [counter-app]

  counter-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: counter
      POSTGRES_DB: counter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=20
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nice-almaty_default}
